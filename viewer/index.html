<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Seed</title>
<style>
  :root { --bg:#0f1413; --panel:#171e1c; --line:#2a3431; --text:#dfe6e2; --muted:#8b9893; --accent:#e8c468; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 system-ui,sans-serif; display:grid; grid-template-columns:minmax(0,1fr) 320px; height:100vh; }
  #stage { position:relative; min-width:0; }
  #map { width:100%; height:100%; display:block; cursor:crosshair; }
  aside { background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:14px; }
  h1 { font-size:15px; margin:0 0 10px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:16px 0 6px; }
  label.row { display:grid; grid-template-columns:1fr 92px; align-items:center; gap:8px; margin:4px 0; }
  label.check { display:flex; align-items:center; gap:7px; margin:3px 0; }
  input[type=number], select { width:100%; background:#10161a; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:3px 5px; }
  input[type=range] { width:100%; }
  button { background:#232d2a; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .buttons { display:flex; gap:6px; margin-top:8px; }
  .swatch { width:10px; height:10px; border-radius:2px; display:inline-block; }
  .stat { display:flex; justify-content:space-between; margin:2px 0; }
  .stat b { font-weight:600; font-variant-numeric:tabular-nums; }
  #hash { font-family:ui-monospace,monospace; color:var(--muted); font-size:11px; word-break:break-all; }
  #section { width:100%; height:190px; background:#10161a; border:1px solid var(--line); border-radius:4px; display:block; }
  #error { color:#ff8a70; margin-top:6px; }
  @media (max-width:760px) { body { grid-template-columns:1fr; grid-template-rows:60vh auto; height:auto; } aside { border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<div id="stage"><canvas id="map"></canvas></div>
<aside>
  <h1>City Seed: distrito</h1>
  <h2>Geração</h2>
  <label class="row">Seed <input id="seed" type="number" value="42" min="0"></label>
  <label class="row">Tamanho (m) <input id="size" type="number" value="1200" min="200" max="8000" step="100"></label>
  <label class="row">Fiação aérea <input id="overhead" type="range" min="0" max="1" step="0.05" value="0.5"></label>
  <label class="row">Parques <input id="parks" type="range" min="0" max="0.4" step="0.02" value="0.08"></label>
  <label class="row">Densidade <input id="density" type="range" min="0" max="1" step="0.05" value="0.5"></label>
  <label class="check"><input id="gas" type="checkbox" checked> Gás encanado</label>
  <div class="buttons"><button id="generate">Gerar</button><button id="random">Seed aleatória</button></div>
  <div id="error"></div>

  <h2>Ferramenta (clique no mapa)</h2>
  <label class="check"><input type="radio" name="mode" value="destroy" checked> Destruir área</label>
  <label class="check"><input type="radio" name="mode" value="cut"> Romper trecho de rede</label>
  <label class="check"><input type="radio" name="mode" value="section"> Corte da rua</label>
  <label class="row">Raio (m) <input id="radius" type="range" min="10" max="300" step="5" value="60"></label>
  <label class="row">Profundidade (m) <input id="depth" type="range" min="0" max="12" step="0.25" value="1.5"></label>
  <div class="buttons"><button id="reset">Restaurar cidade</button></div>

  <h2>Camadas</h2>
  <div id="layers"></div>

  <h2>Corte da rua</h2>
  <canvas id="section"></canvas>

  <h2>Situação</h2>
  <div id="stats"></div>
  <div id="hash"></div>
</aside>
<script src="main.js"></script>
</body>
</html>
