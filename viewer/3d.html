<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Seed 3D</title>
<style>
  :root { --bg:#0f1413; --panel:#171e1c; --line:#2a3431; --text:#dfe6e2; --muted:#8b9893; --accent:#e8c468; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 system-ui,sans-serif; display:grid; grid-template-columns:minmax(0,1fr) 300px; height:100vh; }
  #stage { position:relative; min-width:0; }
  #view { width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #view:active { cursor:grabbing; }
  #hint { position:absolute; left:12px; bottom:10px; color:#fff; text-shadow:0 1px 3px #000; font-size:12px; pointer-events:none; }
  #loading { position:absolute; inset:0; display:grid; place-items:center; font-size:15px; color:#fff; text-shadow:0 1px 4px #000; pointer-events:none; }
  #loading[hidden] { display:none; }
  aside { background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:14px; }
  h1 { font-size:15px; margin:0 0 4px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:16px 0 6px; }
  a { color:var(--accent); }
  label.row { display:grid; grid-template-columns:1fr 120px; align-items:center; gap:8px; margin:4px 0; }
  label.check { display:flex; align-items:center; gap:7px; margin:3px 0; }
  input[type=number], select { width:100%; background:#10161a; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:3px 5px; }
  input[type=range] { width:100%; }
  button { background:#232d2a; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .buttons { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .stat { display:flex; justify-content:space-between; gap:10px; margin:2px 0; }
  .stat span { color:var(--muted); }
  .stat b { font-weight:600; font-variant-numeric:tabular-nums; text-align:right; }
  #hash { font-family:ui-monospace,monospace; color:var(--muted); font-size:11px; word-break:break-all; margin-top:6px; }
  #error { color:#ff8a70; margin-top:6px; }
  @media (max-width:760px) { body { grid-template-columns:1fr; grid-template-rows:60vh auto; height:auto; } aside { border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="loading">Carregando…</div>
  <div id="hint">Arraste para girar · Shift + arraste ou botão direito para mover · Roda para aproximar</div>
</div>
<aside>
  <h1>City Seed 3D</h1>
  <a href="index.html">Abrir o mapa 2D</a>

  <h2>Cidade</h2>
  <label class="row">Seed <input id="seed" type="number" value="42" min="0"></label>
  <label class="row">População <input id="population" type="number" value="5000000" min="1000" max="40000000" step="1000"></label>
  <label class="row">Região <select id="region"></select></label>
  <div class="buttons"><button id="generate">Gerar</button></div>
  <div id="error"></div>

  <h2>Visão</h2>
  <div class="buttons">
    <button id="surface">Superfície</button>
    <button id="underground">Subsolo</button>
    <button id="overview">Cidade inteira</button>
  </div>
  <label class="row">Distritos em detalhe <input id="detail" type="range" min="1" max="64" value="24"></label>

  <h2>Camadas</h2>
  <div id="layers"></div>

  <h2>Desempenho</h2>
  <div id="stats"></div>
  <div class="buttons"><button id="benchmark">Rodar benchmark</button></div>
  <div id="bench"></div>
  <div id="hash"></div>
</aside>
<script src="3d.js"></script>
</body>
</html>
